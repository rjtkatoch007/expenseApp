<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css">
</head>

<body>
  <main class="signup-wrapper">
    <div class="card signup-card shadow-sm">
      <div class="card-body p-4 p-md-5">
        <h1 class="text-center mb-2">Create Account</h1>
        <p class="text-center text-muted mb-4">Sign up to get started</p>

        <form id="signupForm">
          <div class="mb-3">
            <label for="name" class="form-label">Enter your name</label>
            <input type="text" class="form-control" id="name" name="name" placeholder="Your name" required>
          </div>

          <div class="mb-3">
            <label for="email" class="form-label">Enter your email</label>
            <input type="email" class="form-control" id="email" name="email" placeholder="you@example.com" required>
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">Enter your password</label>
            <input type="password" class="form-control" id="password" name="password" placeholder="Password"
              minlength="6" required>
          </div>

          <button type="submit" class="btn btn-primary w-100" id="signupButton">
            Signup
          </button>

          <div id="message" class="mt-3" role="alert"></div>
        </form>

        <div class="text-center mt-4">
          <span class="text-muted">Already have an account?</span>
          <a href="./login.html">Login</a>
        </div>
      </div>
    </div>
  </main>

  <script src="./js/signup.js"></script>
</body>

</html>
