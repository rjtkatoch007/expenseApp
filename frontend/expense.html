<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Daily Expenses</title>


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="./css/style.css">

</head>


<body>

    <div class="container py-5">

        <div class="row justify-content-center">

            <div class="col-lg-8">


                <!-- Header -->
                <nav class="navbar navbar-dark bg-dark">
                    <div class="container">
                        <span class="navbar-brand">
                            Expense Tracker
                        </span>
                        <button id="leaderboardButton" class="btn btn-primary">
                            Leaderboard
                        </button>
                        <button id="premiumButton" class="btn btn-warning">
                            Buy Premium Membership
                        </button>
                        <button id="reportsButton" class="btn btn-info">
                            Expense Reports
                        </button>
                    </div>
                </nav>
                <div class="container mt-3">


                    <div id="premiumMessage" class="alert alert-success text-center fw-bold d-none">
                        You are a premium user now
                    </div>
                    <div class="mt-3">
                        <button id="downloadExpensesButton" class="btn btn-success" type="button">
                            Download Expenses
                        </button>
                    </div>

                    <div id="downloadResult" class="mt-3"></div>
                    <div class="mt-4">
                        <h4>Previous Downloads</h4>

                        <div id="downloadHistory">
                            <p class="text-muted">
                                No previous downloads.
                            </p>
                        </div>
                    </div>

                </div>

                <div class="d-flex justify-content-between align-items-center mb-4">

                    <div>

                        <h1>
                            Daily Expenses
                        </h1>

                        <p id="welcomeUser" class="text-muted mb-0"></p>

                    </div>


                    <button id="logoutButton" class="btn btn-outline-danger">
                        Logout
                    </button>

                </div>




                <!-- Add Expense -->

                <div class="card shadow-sm mb-4">

                    <div class="card-body p-4">

                        <h4 class="mb-4">
                            Add Expense
                        </h4>


                        <form id="expenseForm">


                            <!-- Amount -->

                            <div class="mb-3">

                                <label for="amount" class="form-label">
                                    Expense Amount
                                </label>

                                <input type="number" id="amount" class="form-control" placeholder="Enter amount" min="0"
                                    step="0.01" required>

                            </div>



                            <!-- Description -->

                            <div class="mb-3">

                                <label for="description" class="form-label">
                                    Description
                                </label>

                                <input type="text" id="description" class="form-control"
                                    placeholder="e.g. Lunch at restaurant" required>

                            </div>

                            <div class="mb-3">
                                <label for="note" class="form-label">
                                    Note
                                </label>

                                <input type="text" id="note" class="form-control" placeholder="Add a short note">
                            </div>



                            <!-- Category -->

                            <div class="mb-3">

                                <label for="category" class="form-label">
                                    Category
                                </label>

                                <label for="description" class="form-label">
                                    Description
                                </label>

                                <input type="text" id="description" class="form-control"
                                    placeholder="e.g. Lunch at Domino's" required>



                            </div>



                            <button type="submit" id="addExpenseButton" class="btn btn-primary w-100">
                                Add Expense
                            </button>


                            <div id="expenseMessage" class="mt-3"></div>

                        </form>

                    </div>

                </div>



                <!-- Expenses -->

                <div class="card shadow-sm">

                    <div class="card-body p-4">

                        <h4 class="mb-4">
                            Your Expenses
                        </h4>
                        <!-- Expenses per page -->
                        <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-3">

                            <div class="d-flex align-items-center gap-2">

                                <label for="expensesPerPage" class="form-label mb-0">
                                    Expenses per page:
                                </label>

                                <select id="expensesPerPage" class="form-select form-select-sm" style="width: 100px;">
                                    <option value="5">5</option>
                                    <option value="10">10</option>
                                    <option value="20">20</option>
                                    <option value="50">50</option>
                                    <option value="100">100</option>
                                </select>

                            </div>


                            <!-- Showing X-Y of Z -->
                            <div id="expenseRange" class="text-muted small">
                                Showing 0 - 0 of 0 expenses
                            </div>

                        </div>

                        <div id="expensesContainer"></div>
                        <!-- Pagination -->
                        <!-- Pagination Controls -->
                        <div id="paginationContainer" class="mt-4">

                            <!-- Page navigation -->
                            <div class="d-flex justify-content-center align-items-center gap-2">

                                <button id="previousPage" class="btn btn-outline-primary" type="button">
                                    Previous
                                </button>


                                <div id="pageNumbers" class="d-flex gap-1"></div>


                                <button id="nextPage" class="btn btn-outline-primary" type="button">
                                    Next
                                </button>

                            </div>

                        </div>

                    </div>

                </div>



            </div>

        </div>

    </div>

    <script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>
    <script src="./js/expense.js"></script>

</body>

</html>
