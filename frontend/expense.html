<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Daily Expenses</title>


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="./css/style.css">

</head>


<body>

    <div class="container py-5">

        <div class="row justify-content-center">

            <div class="col-lg-8">


                <!-- Header -->
                <nav class="navbar navbar-dark bg-dark">
                    <div class="container">
                        <span class="navbar-brand">
                            Expense Tracker
                        </span>
                        <button id="leaderboardButton" class="btn btn-primary">
                            Leaderboard
                        </button>
                        <button id="premiumButton" class="btn btn-warning">
                            Buy Premium Membership
                        </button>
                    </div>
                </nav>
                <div class="container mt-3">


                    <div id="premiumMessage" class="alert alert-success text-center fw-bold d-none">
                        You are a premium user now
                    </div>

                </div>

                <div class="d-flex justify-content-between align-items-center mb-4">

                    <div>

                        <h1>
                            Daily Expenses
                        </h1>

                        <p id="welcomeUser" class="text-muted mb-0"></p>

                    </div>


                    <button id="logoutButton" class="btn btn-outline-danger">
                        Logout
                    </button>

                </div>




                <!-- Add Expense -->

                <div class="card shadow-sm mb-4">

                    <div class="card-body p-4">

                        <h4 class="mb-4">
                            Add Expense
                        </h4>


                        <form id="expenseForm">


                            <!-- Amount -->

                            <div class="mb-3">

                                <label for="amount" class="form-label">
                                    Expense Amount
                                </label>

                                <input type="number" id="amount" class="form-control" placeholder="Enter amount" min="0"
                                    step="0.01" required>

                            </div>



                            <!-- Description -->

                            <div class="mb-3">

                                <label for="description" class="form-label">
                                    Description
                                </label>

                                <input type="text" id="description" class="form-control"
                                    placeholder="e.g. Lunch at restaurant" required>

                            </div>



                            <!-- Category -->

                            <div class="mb-3">

                                <label for="category" class="form-label">
                                    Category
                                </label>

                                <label for="description" class="form-label">
                                    Description
                                </label>

                                <input type="text" id="description" class="form-control"
                                    placeholder="e.g. Lunch at Domino's" required>

                                <!--  <select id="category" class="form-select" required>

                                    <option value="">
                                        Select category
                                    </option>

                                    <option value="Food">
                                        Food
                                    </option>

                                    <option value="Petrol">
                                        Petrol
                                    </option>

                                    <option value="Salary">
                                        Salary
                                    </option>

                                    <option value="Shopping">
                                        Shopping
                                    </option>

                                    <option value="Travel">
                                        Travel
                                    </option>

                                    <option value="Bills">
                                        Bills
                                    </option>

                                    <option value="Entertainment">
                                        Entertainment
                                    </option>

                                    <option value="Other">
                                        Other
                                    </option>

                                </select> -->

                            </div>



                            <button type="submit" id="addExpenseButton" class="btn btn-primary w-100">
                                Add Expense
                            </button>


                            <div id="expenseMessage" class="mt-3"></div>

                        </form>

                    </div>

                </div>



                <!-- Expenses -->

                <div class="card shadow-sm">

                    <div class="card-body p-4">

                        <h4 class="mb-4">
                            Your Expenses
                        </h4>


                        <div id="expensesContainer"></div>

                    </div>

                </div>


            </div>

        </div>

    </div>

    <script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>
    <script src="./js/expense.js"></script>

</body>

</html>
